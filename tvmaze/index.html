<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TV Show Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📺 TV Show Explorer</h1>
    <p class="tagline">TV series, powered by the TVmaze API</p>
  </header>

  <main>
    <form id="search-form" class="inline-form">
      <label for="search-input">Search by name</label>
      <input id="search-input" type="search" placeholder="e.g. office" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <form id="id-form" class="inline-form">
      <label for="id-input">Show ID</label>
      <input id="id-input" type="text" inputmode="numeric" placeholder="e.g. 431" autocomplete="off">
      <button type="submit">Open show</button>
      <p id="form-message"></p>
    </form>

    <section id="favourites"></section>
    <section id="search-results"></section>

    <section id="show-details">
      <p>Loading…</p>
    </section>
  </main>

  <footer>
    Data from <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>,
    licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a>.
    Not affiliated with TVmaze.
  </footer>

  <script src="script.js"></script>
</body>
</html>
