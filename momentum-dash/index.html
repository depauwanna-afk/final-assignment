<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="time">00:00</h1>
    <h2 id="greeting">Hello</h2>
    <form id="name-form" hidden>
      <label for="name-input">What's your name?</label>
      <input id="name-input" type="text" autocomplete="off">
    </form>
  </main>
    <section id="todo">
    <h3>To-do</h3>
    <ul id="todo-list"></ul>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="New to-do" autocomplete="off">
    </form>
  </section>
  <script src="script.js"></script>
</body>
</html>
